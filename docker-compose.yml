version: '3.8'

services:
  java-core-ms:
    build: .
    container_name: java_core_ms
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST:-postgres-db}:${DB_PORT:-5432}/${DB_NAME:-global_invoice}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres_password}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - METRICS_BASE_URL=${METRICS_BASE_URL:-http://python-metrics-ms:5000}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://micro-python.onrender.com,https://global-invoice-virid.vercel.app}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
    networks:
      - global-invoice-net

networks:
  global-invoice-net:
    external: true