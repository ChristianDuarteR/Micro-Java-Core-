spring:
  datasource:
    url: jdbc:h2:mem:global_invoice_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

jwt:
  secret: test_secret_key_global_invoice_must_be_32_chars
  expiration-ms: 3600000

soap:
  number-conversion-url: http://localhost/soap-mock

metrics:
  base-url: http://localhost:5000
  internal-key: test-internal-key

app:
  cors:
    allowed-origins: http://localhost:4200
